name: APK de prueba Android TV
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: apk-tv
  cancel-in-progress: false
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Mantener firma de pruebas entre compilaciones
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: tv-debug-signing-v1
      - run: gradle --no-daemon lintDebug assembleDebug
      - name: Preparar descarga
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk gira-y-adivina-tv-prueba.apk
          sha256sum gira-y-adivina-tv-prueba.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: gira-y-adivina-tv-prueba
          path: |
            gira-y-adivina-tv-prueba.apk
            SHA256SUMS.txt
          retention-days: 30
      - name: Publicar APK de prueba
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="prueba-tv-${GITHUB_RUN_NUMBER}"
          gh release create "$tag" gira-y-adivina-tv-prueba.apk SHA256SUMS.txt --prerelease --title "Sala TV · prueba ${GITHUB_RUN_NUMBER}" --notes "APK de instalación manual para Android TV. Requiere internet y celulares. Pendiente de validación en una TV física. No es una publicación en Play Store. Código: ${GITHUB_SHA}."
